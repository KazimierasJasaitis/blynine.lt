<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netrukus bus atidaryta</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2.5rem 1rem 3rem;
      background: #111;
      color: #f4f1ea;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      max-width: 16ch;
      font-size: clamp(2.75rem, 9vw, 6.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    .embed {
      width: min(560px, 100%);
      aspect-ratio: 560 / 384;
      background: #000;
    }
    .embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>Netrukus bus atidaryta</h1>
  <div class="embed">
    <iframe
      src="https://archive.org/embed/papaspancakeria_v2"
      title="Papa's Pancakeria"
      width="560"
      height="384"
      frameborder="0"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allowfullscreen
      allow="fullscreen"
    ></iframe>
  </div>
</body>
</html>
