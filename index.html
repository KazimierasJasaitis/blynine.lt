<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netrukus bus atidaryta</title>
  <style>
    :root { color-scheme: dark; }
    ::selection {
      background: #f4f1ea;
      color: #1a120c;
      text-shadow: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      justify-content: safe center;
      gap: 2.5rem;
      padding: 2.5rem 1rem 3rem;
      background: #111;
      color: #f4f1ea;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #111;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 17, 0.38);
    }
    .bg-track {
      width: max(100%, calc(100vh * 646 / 1236));
      width: max(100%, calc(100dvh * 646 / 1236));
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      animation: bg-scroll 120s linear infinite;
    }
    .bg-track img {
      display: block;
      width: 100%;
      height: auto;
    }
    @keyframes bg-scroll {
      from { transform: translate3d(0, -50%, 0); }
      to { transform: translate3d(0, 0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-track { animation: none; }
    }
    header, .stage {
      position: relative;
      z-index: 1;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }
    h1 {
      margin: 0;
      max-width: 16ch;
      font-size: clamp(2.75rem, 9vw, 6.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
    }
    header p, .ask-label {
      margin: 0;
      max-width: min(54rem, 92vw);
      font-size: clamp(1.15rem, 2.6vw, 1.7rem);
      font-weight: 400;
      line-height: 1.35;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
    }
    .ask {
      position: relative;
      width: min(52rem, calc(100vw - 2rem));
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.7rem;
      margin: 0.2rem 0 0.1rem;
    }
    .ask-label {
      text-align: center;
    }
    .ask-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .ask-email {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.4rem;
    }
    .ask textarea,
    .ask input[type="email"] {
      flex: 1 1 0;
      min-width: 0;
      margin: 0;
      padding: 0.65rem 0.75rem;
      border: 1px solid rgba(244, 241, 234, 0.45);
      background: rgba(17, 17, 17, 0.72);
      color: #f4f1ea;
      font: inherit;
      font-size: 1rem;
      text-align: left;
    }
    .ask textarea {
      resize: none;
      height: 2.75rem;
      min-height: 2.75rem;
      padding: 0.35rem 0.45rem;
      font-size: 0.5rem;
      line-height: 1.2;
      overflow: hidden;
    }
    .ask input[type="email"] {
      height: 2.75rem;
    }
    .news {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 0.4rem;
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.25;
      text-align: left;
      cursor: pointer;
    }
    .news input {
      margin: 0.15rem 0 0;
      flex: 0 0 auto;
    }
    .ask button {
      flex: 0 0 auto;
      align-self: flex-start;
      height: 2.75rem;
      margin: 0;
      padding: 0.45em 1.15em;
      border: 0;
      background: #2f9e44;
      color: #f4f1ea;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .ask[hidden],
    .thanks[hidden] { display: none; }
    .stage {
      width: min(640px, 100%);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }
    .embed {
      position: relative;
      width: 100%;
      min-width: 0;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #000;
      container-type: inline-size;
    }
    .embed-scale {
      width: 640px;
      height: 480px;
      transform-origin: top left;
      transform: scale(calc(100cqw / 640px));
    }
    .embed iframe {
      display: block;
      width: 640px;
      height: 480px;
      border: 0;
    }
    .cover {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #111;
      cursor: pointer;
    }
    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .play {
      margin: 0;
      padding: 0.45em 1.15em;
      border: 0;
      background: #2f9e44;
      color: #f4f1ea;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.15s ease;
    }
    .play:hover,
    .play:focus-visible {
      transform: scale(1.08);
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-track">
      <img src="/blynai-bg.png" alt="">
      <img src="/blynai-bg.png" alt="">
    </div>
  </div>
  <header>
    <h1>Netrukus bus atidaryta</h1>
    <form class="ask" action="/pateikti.php" method="post">
      <label class="ask-label" for="pasiulymas">Kas turėtų būti blynine.lt?</label>
      <div class="ask-row">
        <textarea id="pasiulymas" name="pasiulymas" required maxlength="2000" rows="1"></textarea>
        <div class="ask-email">
          <input id="elpastas" type="email" name="elpastas" maxlength="200" placeholder="El. paštas (nebūtina)" autocomplete="email">
          <label class="news" for="naujienos">
            <input id="naujienos" type="checkbox" name="naujienos" value="1">
            gauti blyninės naujienas
          </label>
        </div>
        <button type="submit">Pateikti</button>
      </div>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>
    <p class="thanks" hidden>Ačiū.</p>
    <p>o čia gali pažaisti papas pankeikerija (liet. Tėtušio blyninė)</p>
  </header>
  <div class="stage">
    <div class="embed">
      <div class="embed-scale">
        <iframe
          src="https://archive.org/embed/papaspancakeria_v2"
          title="Papa's Pancakeria"
          width="640"
          height="480"
          frameborder="0"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          allowfullscreen
          allow="fullscreen"
        ></iframe>
      </div>
      <button class="cover" type="button" aria-label="ŽAISTI!">
        <img src="/thumbnail.webp" alt="">
      </button>
    </div>
    <button class="play" type="button">ŽAISTI!</button>
  </div>
  <script>
    function startGame() {
      var cover = document.querySelector(".cover");
      var play = document.querySelector(".play");
      if (cover) cover.remove();
      if (play) play.remove();
    }
    document.querySelector(".cover").addEventListener("click", startGame);
    document.querySelector(".play").addEventListener("click", startGame);
    var box = document.getElementById("pasiulymas");
    function fitBox() {
      box.style.height = "auto";
      box.style.height = (box.scrollHeight + box.offsetHeight - box.clientHeight) + "px";
    }
    box.addEventListener("input", fitBox);
    window.addEventListener("resize", fitBox);
    var news = document.getElementById("naujienos");
    var email = document.getElementById("elpastas");
    function syncEmail() {
      var on = news.checked;
      email.required = on;
      email.placeholder = on ? "El. paštas" : "El. paštas (nebūtina)";
    }
    news.addEventListener("change", syncEmail);
    if (new URLSearchParams(location.search).get("pateikta") === "1") {
      document.querySelector(".ask").hidden = true;
      document.querySelector(".thanks").hidden = false;
    }
  </script>
</body>
</html>
