name: blynine-website-test
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blynine_test
      MYSQL_USER: blynine_test
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-test-root
    ports:
      - "127.0.0.1:33079:3306"
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "--host=127.0.0.1", "--user=blynine_test", "--password=local-test-only", "blynine_test", "--execute=SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/mysql
  web:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    ports:
      - "127.0.0.1:8087:80"
    environment:
      BLYNINE_TEST_DB_HOST: database
      BLYNINE_TEST_DB_PORT: 3306
      BLYNINE_TEST_APP_ROOT: /var/www/html
    volumes:
      - ../dist/hostinger:/var/www/html:ro
      - ../tests:/tests:ro
      - ./config.env:/var/www/.env:ro
    depends_on:
      database:
        condition: service_healthy
volumes:
  database:
