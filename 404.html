<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404</title>
  <link rel="icon" href="/icon.png" type="image/png" sizes="512x512">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; }
    ::selection {
      background: #f4f1ea;
      color: #1a120c;
      text-shadow: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
      background: #111;
      color: #f4f1ea;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #111;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 17, 0.38);
    }
    .bg-track {
      width: max(100%, calc(100vh * 646 / 1236));
      width: max(100%, calc(100dvh * 646 / 1236));
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      animation: bg-scroll 120s linear infinite;
    }
    .bg-track img {
      display: block;
      width: 100%;
      height: auto;
    }
    @keyframes bg-scroll {
      from { transform: translate3d(0, -50%, 0); }
      to { transform: translate3d(0, 0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-track { animation: none; }
    }
    h1, .miss {
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 0;
      font-size: clamp(5.5rem, 20vw, 12rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
    }
    .miss {
      width: min(280px, 70vw);
      height: auto;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-track">
      <img src="/blynai-bg.png" alt="">
      <img src="/blynai-bg.png" alt="">
    </div>
  </div>
  <h1>404</h1>
  <img class="miss" src="/404.gif" alt="">
</body>
</html>
